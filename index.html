<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cyber News Post Generator</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>

    body{
      font-family:'Noto Sans Bengali',sans-serif;
      background:#040908;
      color:white;
    }

    .glass{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
    }

    .card-shadow{
      box-shadow:
      0 0 20px rgba(0,255,140,0.08),
      0 0 80px rgba(0,0,0,0.7);
    }

    textarea{
      resize:none;
    }

    /* PREVIEW AREA */

    .preview-box{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      padding:10px 0;
    }

    .preview-scale{
      width:min(100%,520px);
      aspect-ratio:1/1;
      position:relative;
    }

    /* MAIN CARD */

    .news-card{
      width:1080px;
      height:1080px;
      position:absolute;
      top:0;
      left:0;
      overflow:hidden;
      border-radius:28px;
      background:#101514;
      transform-origin:top left;
      transform:scale(calc(min(100vw,520px)/1080));
    }

    @media(min-width:1024px){
      .news-card{
        transform:scale(0.45);
      }
    }

    .image-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(
      to top,
      rgba(0,0,0,0.98) 0%,
      rgba(0,0,0,0.82) 35%,
      rgba(0,0,0,0.25) 65%,
      rgba(0,0,0,0) 100%
      );
    }

  </style>
</head>

<body>

<div class="max-w-7xl mx-auto p-4 lg:p-8">

  <!-- HEADER -->

  <div class="mb-8">
    <h1 class="text-3xl lg:text-5xl font-extrabold text-green-400">
      Cyber News Post Generator
    </h1>

    <p class="text-gray-400 mt-2">
      Professional Facebook & Instagram News Card Maker
    </p>
  </div>

  <!-- LAYOUT -->

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

    <!-- LEFT PANEL -->

    <div class="glass rounded-3xl p-6 card-shadow">

      <h2 class="text-3xl font-bold text-green-400 mb-6">
        Input Controls
      </h2>

      <!-- IMAGE -->

      <div class="mb-5">
        <label class="block mb-2 font-semibold">
          Main News Image
        </label>

        <input
        type="file"
        id="imageUpload"
        accept="image/*"
        class="w-full bg-black/40 border border-gray-700 rounded-xl p-4"
        >
      </div>

      <!-- HEADLINE -->

      <div class="mb-5">
        <label class="block mb-2 font-semibold">
          হেডলাইন
        </label>

        <textarea
        id="headlineInput"
        maxlength="100"
        rows="3"
        placeholder="এখানে হেডলাইন লিখুন..."
        class="w-full bg-black/40 border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-green-500"
        ></textarea>

        <div class="text-right text-sm text-gray-400 mt-1">
          <span id="headlineCount">0</span>/100
        </div>
      </div>

      <!-- DETAILS -->

      <div class="mb-5">
        <label class="block mb-2 font-semibold">
          বিস্তারিত
        </label>

        <textarea
        id="detailsInput"
        rows="5"
        placeholder="এখানে বিস্তারিত লিখুন..."
        class="w-full bg-black/40 border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-green-500"
        ></textarea>
      </div>

      <!-- REPORTER -->

      <div class="mb-5">
        <label class="block mb-2 font-semibold">
          নাম / সোর্স
        </label>

        <input
        type="text"
        id="reporterInput"
        placeholder="MCSF NEWS"
        class="w-full bg-black/40 border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-green-500"
        >
      </div>

      <!-- DATE -->

      <div class="mb-5">
        <label class="block mb-2 font-semibold">
          তারিখ
        </label>

        <input
        type="text"
        id="dateInput"
        placeholder="০৬ জুন ২০২৬"
        class="w-full bg-black/40 border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-green-500"
        >
      </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="glass rounded-3xl p-5 card-shadow">

      <div class="flex items-center justify-between mb-4">

        <h2 class="text-3xl font-bold text-green-400">
          Live Preview
        </h2>

        <span class="text-gray-400">
          1080 × 1080
        </span>

      </div>

      <!-- PREVIEW -->

      <div class="preview-box">

        <div class="preview-scale">

          <!-- CARD -->

          <div id="newsCard" class="news-card">

            <!-- IMAGE -->

            <img
            id="previewImage"
            src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1400&auto=format&fit=crop"
            class="absolute inset-0 w-full h-full object-cover"
            >

            <!-- OVERLAY -->

            <div class="image-overlay"></div>

            <!-- TOP -->

            <div class="absolute top-0 left-0 w-full p-10 flex justify-between items-start">

              <!-- TAG -->

              <div class="bg-green-500/20 border border-green-500/40 px-6 py-3 rounded-full">

                <span class="text-green-300 font-bold tracking-widest text-[28px]">
                  CYBER NEWS
                </span>

              </div>

              <!-- LOGO -->

              <div class="w-32 h-32 rounded-2xl bg-black/50 p-3 border border-white/10">

                <img
                src="logo.png"
                class="w-full h-full object-contain"
                >

              </div>

            </div>

            <!-- CONTENT -->

            <div class="absolute bottom-0 left-0 w-full p-12">

              <!-- LINE -->

              <div class="w-40 h-2 bg-green-400 rounded-full mb-8"></div>

              <!-- HEADLINE -->

              <h1
              id="previewHeadline"
              class="text-white text-[64px] font-extrabold leading-tight mb-6 drop-shadow-[0_5px_20px_rgba(0,0,0,0.9)]"
              >
                এখানে আপনার নিউজ হেডলাইন দেখা যাবে
              </h1>

              <!-- DETAILS -->

              <p
              id="previewDetails"
              class="text-gray-200 text-[30px] leading-relaxed mb-10"
              >
                বিস্তারিত তথ্য এখানে দেখা যাবে...
              </p>

              <!-- FOOTER -->

              <div class="flex items-center justify-between border-t border-white/10 pt-6">

                <div>

                  <p class="text-gray-400 text-[22px] uppercase tracking-widest">
                    REPORTER
                  </p>

                  <p
                  id="previewReporter"
                  class="text-white text-[30px] font-semibold mt-1"
                  >
                    MCSF NEWS
                  </p>

                </div>

                <div class="text-right">

                  <p class="text-gray-400 text-[22px] uppercase tracking-widest">
                    DATE
                  </p>

                  <p
                  id="previewDate"
                  class="text-green-300 text-[28px] font-semibold mt-1"
                  >
                    ০৬ জুন ২০২৬
                  </p>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- BUTTON -->

      <button
      id="downloadBtn"
      class="w-full mt-6 bg-green-500 hover:bg-green-400 transition-all duration-300 text-black font-bold py-4 rounded-2xl text-xl"
      >
        Download Card
      </button>

    </div>

  </div>

</div>

<script>

  // INPUTS

  const imageUpload = document.getElementById('imageUpload');
  const headlineInput = document.getElementById('headlineInput');
  const detailsInput = document.getElementById('detailsInput');
  const reporterInput = document.getElementById('reporterInput');
  const dateInput = document.getElementById('dateInput');

  // PREVIEW

  const previewImage = document.getElementById('previewImage');
  const previewHeadline = document.getElementById('previewHeadline');
  const previewDetails = document.getElementById('previewDetails');
  const previewReporter = document.getElementById('previewReporter');
  const previewDate = document.getElementById('previewDate');

  // COUNTER

  const headlineCount = document.getElementById('headlineCount');

  // IMAGE UPLOAD

  imageUpload.addEventListener('change', function(e){

    const file = e.target.files[0];

    if(file){

      const reader = new FileReader();

      reader.onload = function(event){

        previewImage.src = event.target.result;

      }

      reader.readAsDataURL(file);

    }

  });

  // HEADLINE

  headlineInput.addEventListener('input', function(){

    previewHeadline.textContent =
    this.value || 'এখানে আপনার নিউজ হেডলাইন দেখা যাবে';

    headlineCount.textContent = this.value.length;

  });

  // DETAILS

  detailsInput.addEventListener('input', function(){

    previewDetails.textContent =
    this.value || 'বিস্তারিত তথ্য এখানে দেখা যাবে...';

  });

  // REPORTER

  reporterInput.addEventListener('input', function(){

    previewReporter.textContent =
    this.value || 'MCSF NEWS';

  });

  // DATE

  dateInput.addEventListener('input', function(){

    previewDate.textContent =
    this.value || '০৬ জুন ২০২৬';

  });

  // AUTO DATE

  const now = new Date();

  const formattedDate = now.toLocaleString('bn-BD', {
    day:'2-digit',
    month:'long',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });

  dateInput.value = formattedDate;
  previewDate.textContent = formattedDate;

  // DOWNLOAD

  document.getElementById('downloadBtn').addEventListener('click', async () => {

    const card = document.getElementById('newsCard');

    const canvas = await html2canvas(card, {
      useCORS:true,
      scale:4,
      backgroundColor:null,
      logging:false
    });

    const image = canvas.toDataURL('image/png');

    const link = document.createElement('a');

    link.href = image;
    link.download = 'cyber-news-card.png';

    link.click();

  });

</script>

</body>
</html>
