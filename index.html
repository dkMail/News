<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCSF News Generator - Reloaded</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Hind Siliguri -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- html2canvas & QRious -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }

        /* Custom Inputs */
        .input-box {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #10b981;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-box:focus { border-color: #10b981; }
        .input-box::placeholder { color: #555; }

        /* Magic Highlight */
        .highlight {
            color: #10b981;
            font-weight: 700;
            text-shadow: 0px 0px 15px rgba(16, 185, 129, 0.6);
        }

        /* Glass Text Box */
        .glass-box {
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="border-b border-[#10b981]/30 bg-[#0a0a0a] py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center gap-3">
            <div class="w-3 h-8 bg-[#10b981] rounded-sm"></div>
            <div>
                <h1 class="text-2xl font-bold tracking-wider">MCSF <span class="text-[#10b981]">SYSTEM</span></h1>
                <p class="text-[11px] text-gray-400 uppercase tracking-[0.2em]">News Card Generator V2</p>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-2 gap-8 items-start mt-4">
        
        <!-- LEFT: Control Panel -->
        <section class="bg-[#0a0a0a] border border-[#222] p-6 rounded-xl shadow-2xl flex flex-col gap-4">
            
            <div>
                <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">১. খবরের ছবি</label>
                <input type="file" id="upload-img" accept="image/*" class="input-box file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:bg-[#10b981] file:text-black file:font-bold cursor-pointer">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">২. ব্যাজ টেক্সট</label>
                    <input type="text" id="in-badge" value="সাইবার অ্যালার্ট" class="input-box">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">ব্যাজের রঙ</label>
                    <select id="in-color" class="input-box">
                        <option value="#10b981">সবুজ (Cyber)</option>
                        <option value="#ef4444">লাল (Breaking)</option>
                        <option value="#3b82f6">নীল (Info)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1 flex justify-between">
                    <span>৩. হেডলাইন</span>
                    <span class="text-[#10b981]">*শব্দ* = সবুজ হাইলাইট</span>
                </label>
                <textarea id="in-headline" rows="3" class="input-box resize-none">মাটূয়াইল *সাইবার সিকিউরিটি ফোর্সের* নতুন ওয়েব অ্যাপ্লিকেশন চালু!</textarea>
            </div>

            <div>
                <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">৪. বিস্তারিত</label>
                <textarea id="in-details" rows="3" class="input-box resize-none">নতুন সিস্টেমে প্রিভিউ এবং ডাউনলোড সমস্যার ১০০% স্থায়ী সমাধান করা হয়েছে।</textarea>
            </div>

            <div>
                <label class="block text-[11px] text-gray-400 font-bold uppercase mb-1">৫. প্রতিবেদক</label>
                <input type="text" id="in-reporter" value="MCSF ডেস্ক" class="input-box">
            </div>

            <button id="btn-download" class="mt-4 w-full bg-[#10b981] hover:bg-emerald-400 text-black font-bold uppercase py-4 rounded-lg flex justify-center items-center gap-2 transition shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                এইচডি কার্ড সেভ করুন
            </button>
        </section>

        <!-- RIGHT: Live Preview Container -->
        <section class="flex flex-col items-center">
            
            <div class="mb-3 text-[#10b981] text-sm font-bold flex items-center gap-2 uppercase tracking-widest">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> লাইভ প্রিভিউ
            </div>

            <!-- THIS WRAPPER FIXES THE MOBILE OVERFLOW BUG 100% -->
            <div id="preview-wrapper" style="width: 100%; max-width: 500px; position: relative; overflow: hidden; border: 2px solid #10b981; border-radius: 8px;">
                
                <!-- THE ACTUAL 1080x1080 CARD -->
                <div id="capture-area" style="width: 1080px; height: 1080px; transform-origin: top left; position: absolute; top: 0; left: 0; background: #000;">
                    
                    <!-- Background Image -->
                    <img id="out-img" src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1080&auto=format&fit=crop" style="width: 1080px; height: 1080px; object-fit: cover; position: absolute; top: 0; left: 0;">

                    <!-- Dot Pattern -->
                    <div style="position: absolute; top: 0; left: 0; width: 1080px; height: 1080px; background-image: radial-gradient(rgba(16, 185, 129, 0.25) 2px, transparent 2px); background-size: 30px 30px; pointer-events: none;"></div>

                    <!-- Top Dark Gradient for logo -->
                    <div style="position: absolute; top: 0; left: 0; width: 1080px; height: 300px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);"></div>

                    <!-- Badge -->
                    <div id="out-badge-container" style="position: absolute; top: 40px; left: 40px; background: #10b981; padding: 10px 25px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.3);">
                        <span id="out-badge" style="color: white; font-size: 28px; font-weight: bold; text-transform: uppercase;">সাইবার অ্যালার্ট</span>
                    </div>

                    <!-- Logo -->
                    <img id="out-logo" src="32390.png" style="position: absolute; top: 30px; right: 40px; width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));">

                    <!-- Bottom Glass Area -->
                    <div class="glass-box" style="position: absolute; bottom: 0; left: 0; width: 1080px; padding: 0 50px 40px 50px;">
                        
                        <!-- Headline -->
                        <h2 id="out-headline" style="font-size: 55px; font-weight: bold; line-height: 1.3; margin-bottom: 25px; border-left: 8px solid #10b981; padding-left: 20px;"></h2>
                        
                        <!-- Details -->
                        <p id="out-details" style="font-size: 28px; color: #d1d5db; line-height: 1.6; margin-bottom: 35px;"></p>

                        <!-- Footer Info Bar -->
                        <div style="border-top: 1px solid #333; padding-top: 25px; display: flex; justify-content: space-between; align-items: flex-end;">
                            
                            <!-- Reporter & Date -->
                            <div>
                                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                                    <svg style="width: 28px; height: 28px; color: #10b981;" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path></svg>
                                    <span id="out-reporter" style="font-size: 24px; font-weight: bold; text-transform: uppercase;"></span>
                                </div>
                                <div id="out-date" style="font-size: 22px; color: #9ca3af;"></div>
                            </div>

                            <!-- QR Code Block -->
                            <div style="display: flex; align-items: center; gap: 20px;">
                                <div style="text-align: right;">
                                    <div style="font-size: 14px; color: #10b981; font-weight: bold; letter-spacing: 2px;">SCAN TO CONNECT</div>
                                    <div style="font-size: 18px; font-weight: bold; margin-top: 4px;">MCSF LINKS</div>
                                </div>
                                <div style="background: white; padding: 8px; border-radius: 8px; border: 3px solid #10b981;">
                                    <canvas id="qr-canvas" width="90" height="90"></canvas>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Bottom Accent Line -->
                    <div style="position: absolute; bottom: 0; left: 0; width: 1080px; height: 8px; background: linear-gradient(to right, #10b981, #ef4444);"></div>

                </div>
            </div>
        </section>
    </main>

    <!-- CORE LOGIC SCRIPT -->
    <script>
        const wrapper = document.getElementById('preview-wrapper');
        const captureArea = document.getElementById('capture-area');

        // 1. BULLETPROOF SCALING ENGINE (Fixes the mobile overflow issue permanently)
        function engineResize() {
            // Get wrapper's current actual width on screen
            let wrapperWidth = wrapper.clientWidth; 
            if (wrapperWidth === 0) return; // Prevent division by zero on load
            
            // Calculate scale ratio based on 1080px original size
            let scaleRatio = wrapperWidth / 1080;
            
            // Apply scale to the inner card
            captureArea.style.transform = `scale(${scaleRatio})`;
            
            // Force the wrapper's height to match the scaled card height exactly!
            wrapper.style.height = `${1080 * scaleRatio}px`;
        }

        // Run engine on everything
        window.addEventListener('resize', engineResize);
        window.addEventListener('load', engineResize);
        setTimeout(engineResize, 50);
        setTimeout(engineResize, 500);

        // 2. DATA BINDING
        function updateData() {
            // Text Replacements
            let rawHeadline = document.getElementById('in-headline').value;
            document.getElementById('out-headline').innerHTML = rawHeadline.replace(/\*(.*?)\*/g, '<span class="highlight">$1</span>');
            
            document.getElementById('out-details').innerText = document.getElementById('in-details').value;
            document.getElementById('out-reporter').innerText = document.getElementById('in-reporter').value;

            // Badge Setup
            let badgeText = document.getElementById('in-badge').value.trim();
            let badgeBox = document.getElementById('out-badge-container');
            if(badgeText === "") {
                badgeBox.style.display = 'none';
            } else {
                badgeBox.style.display = 'block';
                document.getElementById('out-badge').innerText = badgeText;
            }
            badgeBox.style.backgroundColor = document.getElementById('in-color').value;
        }

        // Add Listeners
        document.getElementById('in-headline').addEventListener('input', updateData);
        document.getElementById('in-details').addEventListener('input', updateData);
        document.getElementById('in-reporter').addEventListener('input', updateData);
        document.getElementById('in-badge').addEventListener('input', updateData);
        document.getElementById('in-color').addEventListener('change', updateData);

        // 3. IMAGE UPLOAD
        document.getElementById('upload-img').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('out-img').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 4. DATE SYSTEM
        function setDate() {
            const date = new Date();
            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const convertToBn = num => num.toString().split('').map(d => {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'}[d] || d).join('');
            document.getElementById('out-date').innerText = `${convertToBn(date.getDate().toString().padStart(2, '0'))} ${months[date.getMonth()]}, ${convertToBn(date.getFullYear())}`;
        }

        // 5. QR CODE
        function initQR() {
            const linkData = "MCSF Official Links:\nFB: https://www.facebook.com/profile.php?id=61576825379963nTG: https://t.me/team_mcsf001nWA: https://whatsapp.com/channel/0029VbDJp5cBvvsXJwqLJG0N";
            new QRious({
                element: document.getElementById('qr-canvas'),
                value: linkData,
                size: 150,
                background: 'white',
                foreground: 'black'
            });
        }

        // Run Init Functions
        setDate();
        initQR();
        updateData();

        // 6. HD DOWNLOAD ENGINE (Guaranteed 1080x1080 capture without clone bugs)
        document.getElementById('btn-download').addEventListener('click', function() {
            let btn = this;
            let originalHTML = btn.innerHTML;
            btn.innerHTML = 'প্রসেসিং হচ্ছে...';
            btn.disabled = true;

            // Step A: Store current responsive states
            let oldWrapperWidth = wrapper.style.width;
            let oldWrapperMaxWidth = wrapper.style.maxWidth;
            let oldWrapperHeight = wrapper.style.height;
            let oldTransform = captureArea.style.transform;

            // Step B: FORCE raw 1080x1080 native size for html2canvas to read perfectly
            wrapper.style.width = '1080px';
            wrapper.style.maxWidth = '1080px';
            wrapper.style.height = '1080px';
            captureArea.style.transform = 'none';

            // Step C: Small timeout to let browser apply the CSS forces
            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 1, 
                    width: 1080, 
                    height: 1080, 
                    useCORS: true, 
                    backgroundColor: "#000000"
                }).then(canvas => {
                    
                    // Step D: Revert back to responsive state IMMEDIATELY
                    wrapper.style.width = oldWrapperWidth;
                    wrapper.style.maxWidth = oldWrapperMaxWidth;
                    wrapper.style.height = oldWrapperHeight;
                    captureArea.style.transform = oldTransform;
                    engineResize(); // Recalculate

                    // Trigger Download
                    let link = document.createElement('a');
                    link.download = `MCSF_System_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();

                    btn.innerHTML = originalHTML;
                    btn.disabled = false;

                }).catch(err => {
                    // Revert on error
                    wrapper.style.width = oldWrapperWidth;
                    wrapper.style.maxWidth = oldWrapperMaxWidth;
                    wrapper.style.height = oldWrapperHeight;
                    captureArea.style.transform = oldTransform;
                    engineResize();
                    
                    alert("ডাউনলোড ফেইল হয়েছে। আবার চেষ্টা করুন।");
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                });
            }, 100);
        });

    </script>
</body>
</html>
